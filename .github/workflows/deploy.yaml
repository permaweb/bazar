name: publish

on:
    push:
        branches:
            - 'main'
            - 'staging'

jobs:
    publish:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - uses: actions/setup-node@v1
              with:
                  node-version: 22.23.4
            - run: npm install
            - run: npm run deploy:main
              env:
                  DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
                  # Temporary: arweave.net does not serve ~relay@1.0 yet, so transaction
                  # observers reach Arweave's own nodes through mystical.computer's relay.
                  # Remove once arweave.net relays (see README, "observers").
                  VITE_ARWEAVE_OBSERVER_RELAY: https://mystical.computer

    publish-staging:
        if: github.ref == 'refs/heads/staging'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - uses: actions/setup-node@v1
              with:
                  node-version: 22.23.4
            - run: npm install
            - run: npm run deploy:staging
              env:
                  DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
                  # Temporary: arweave.net does not serve ~relay@1.0 yet, so transaction
                  # observers reach Arweave's own nodes through mystical.computer's relay.
                  # Remove once arweave.net relays (see README, "observers").
                  VITE_ARWEAVE_OBSERVER_RELAY: https://mystical.computer
